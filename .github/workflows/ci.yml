name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`. A toolchain that changes under a green pipeline is the same class of
          # failure as the line-ending mismatch that kept this workflow red: local and CI must agree.
          bun-version: 1.3.14

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: snapshots match the pinned hashes
        run: bun run snapshot:check

      - name: test
        run: bun test

      - name: build
        run: bun run build
