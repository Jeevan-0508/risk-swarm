name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`. A toolchain that changes under a green pipeline is the same class of
          # failure as the line-ending mismatch that kept this workflow red: local and CI must agree.
          bun-version: 1.3.14

      - name: install
        run: bun install --frozen-lockfile

      # A failing test must not ship a demo that claims to be verified.
      - name: test
        run: bun test

      - name: build
        run: bun run build

      # GitHub Pages is a static file server with no SPA fallback: a direct load or reload of a
      # client-side route (e.g. /pantheon) 404s before React ever runs. The standard fix is to ship
      # the same index.html as 404.html, so Pages serves the app shell for any unmatched path and
      # BrowserRouter (with basename already baked into the built asset paths) takes it from there.
      - name: spa fallback for client-side routes
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
